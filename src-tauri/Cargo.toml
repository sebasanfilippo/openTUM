[package]
name = "opentum"
version = "0.1.0"
description = "openTUM (Open Token Usage Monitor): monitor de consumo de servicios de IA para Linux"
authors = ["Sebastian Andres Sanfilippo <sebastian.sanfilippo@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/sebasanfilippo/openTUM"
edition = "2021"
rust-version = "1.85"

[lib]
name = "opentum_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }
jsonschema = { version = "0.33", default-features = false }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
regex = "1"
base64 = "0.22"
portable-pty = "0.9"
vt100 = "0.15"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
